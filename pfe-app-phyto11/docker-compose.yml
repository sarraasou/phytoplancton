version: "3.8"
services:

  # ─────────────────────────────────────────────
  # FRONTEND → http://localhost:3001
  # ─────────────────────────────────────────────
  client-ui:
    profiles: ["dev"]
    build:
      context: ./client-ui
      dockerfile: docker/Dockerfile.dev
    ports:
      - "3001:3001"
    volumes:
      - ./client-ui:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - server

  # ─────────────────────────────────────────────
  # API NestJS → http://localhost:3005/api
  # ─────────────────────────────────────────────
  server:
    profiles: ["dev", "prod"]
    build:
      context: ./server
      dockerfile: docker/Dockerfile.dev
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      DATABASE_URL: "postgres://${POSTGRESQL_USER}:${POSTGRESQL_PASSWORD}@db:5432/postgres"
      POSTGRESQL_URL: "postgres://${POSTGRESQL_USER}:${POSTGRESQL_PASSWORD}@db:5432/postgres"
      KONG_URL: http://kong:8000
      SITE_URL: http://localhost:3001
      API_URL: http://localhost:8015
      JWT_SECRET: ${JWT_SECRET}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      BCRYPT_SALT: ${BCRYPT_SALT}
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      SENDINBLEU_API_KEY: ${SENDINBLEU_API_KEY}
      APP_NAME: ${APP_NAME}
    depends_on:
      db:
        condition: service_healthy
      kong:
        condition: service_started
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # IA FastAPI → http://localhost:8001/docs
  # ─────────────────────────────────────────────
  ai-api:
    profiles: ["dev"]
    build: ./ai-api
    ports:
      - "8001:8001"
    volumes:
      - ./ai-api:/app
      - ./ai-api/models:/app/models
      - ./ai-api/images:/app/images
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # BASE DE DONNÉES
  # ─────────────────────────────────────────────
  db:
    profiles: ["prod", "dev"]
    image: supabase/postgres:14.1.0.77
    ports:
      - "5433:5432"
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/supabase/volumes/db/init:/docker-entrypoint-initdb.d

  # ─────────────────────────────────────────────
  # MIGRATION
  # ─────────────────────────────────────────────
  migrate-dev:
    profiles: ["dev"]
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    image: ${CI_REGISTRY_IMAGE:-web_app}/migrate:${CI_COMMIT_SHORT_SHA:-latest}
    build:
      context: ./migrate
      dockerfile: docker/Dockerfile.dev
      args:
        NPM_LOG_LEVEL: notice
    command:
      - /bin/sh
      - -c
      - npx prisma migrate dev --name migrationdata && npm run db:migrate-up && npm run seed && npm run seed:generate && npm run seed:push
    working_dir: /app
    tty: true
    stdin_open: true
    volumes:
      - ./docker/supabase/volumes/db/migration:/app/prisma/migrations
      - ./server/prisma:/app/prisma
      - ./server/scripts:/app/scripts
    environment:
      POSTGRESQL_URL: "postgres://${POSTGRESQL_USER}:${POSTGRESQL_PASSWORD}@db:5432/postgres"
      BCRYPT_SALT: "${BCRYPT_SALT}"
      KONG_URL: http://kong:8000
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    depends_on:
      db:
        condition: service_healthy
      kong:
        condition: service_started

  # ─────────────────────────────────────────────
  # KONG (API Gateway) → port hôte 8015
  # ─────────────────────────────────────────────
  kong:
    profiles: ["prod", "dev"]
    image: kong:2.1
    restart: unless-stopped
    ports:
      - "8015:8000/tcp"
      - "8445:8443/tcp"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: cors,key-auth,acl,basic-auth
    volumes:
      - ./docker/supabase/volumes/api/kong.yml:/var/lib/kong/kong.yml

  # ─────────────────────────────────────────────
  # AUTH (GoTrue)
  # ─────────────────────────────────────────────
  auth:
    profiles: ["prod", "dev"]
    image: supabase/gotrue:v2.17.5
    depends_on:
      - db
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: "postgres://${POSTGRESQL_USER}:${POSTGRESQL_PASSWORD}@db:5432/postgres?search_path=auth"
      API_EXTERNAL_URL: ${API_URL}
      GOTRUE_SITE_URL: ${SITE_URL}/callback
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP}
      GOTRUE_MAILER_TEMPLATES_RECOVERY: ${API_URL}/nest/api/template_email_recovery
      GOTRUE_MAILER_SUBJECTS_RECOVERY: "Reinitialisation du mot de passe"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_DEFAULT_GROUP_NAME: user
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_EXTERNAL_PHONE_ENABLED: ${ENABLE_PHONE_SIGNUP}
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${ENABLE_GOOGLE_SIGNUP}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_APP_CLIENT_ID}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_APP_CLIENT_SECRET}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${API_URL}/auth/v1/callback
      GOTRUE_EXTERNAL_FACEBOOK_ENABLED: ${ENABLE_FACEBOOK_SIGNUP}
      GOTRUE_EXTERNAL_FACEBOOK_CLIENT_ID: ${FACEBOOK_APP_CLIENT_ID}
      GOTRUE_EXTERNAL_FACEBOOK_SECRET: ${FACEBOOK_APP_CLIENT_SECRET}
      GOTRUE_EXTERNAL_FACEBOOK_REDIRECT_URI: ${API_URL}/auth/v1/callback
      GOTRUE_EXTERNAL_TWITTER_ENABLED: true
      GOTRUE_EXTERNAL_TWITTER_CLIENT_ID: ZfBB1qsrwr0nc5Cmfg3kjpjn0
      GOTRUE_EXTERNAL_TWITTER_SECRET: iVjeCPQhJ99lddgiYjqgLWuCxUuo5FNUr3Wtb8Rr7v9TLAIlnr
      GOTRUE_EXTERNAL_TWITTER_REDIRECT_URI: ${API_URL}/auth/v1/callback
      GOTRUE_EXTERNAL_LINKEDIN_ENABLED: ${ENABLE_LINKEDIN_SIGNUP}
      GOTRUE_EXTERNAL_LINKEDIN_CLIENT_ID: ${LINKEDIN_APP_CLIENT_ID}
      GOTRUE_EXTERNAL_LINKEDIN_SECRET: ${LINKEDIN_APP_CLIENT_SECRET}
      GOTRUE_EXTERNAL_LINKEDIN_REDIRECT_URI: ${API_URL}/auth/v1/callback
      GOTRUE_EXTERNAL_GITHUB_ENABLED: ${ENABLE_GITHUB_SIGNUP}
      GOTRUE_EXTERNAL_GITHUB_CLIENT_ID: ${GITHUB_APP_CLIENT_ID}
      GOTRUE_EXTERNAL_GITHUB_SECRET: ${GITHUB_APP_CLIENT_SECRET}
      GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI: ${API_URL}/auth/v1/callback

  # ─────────────────────────────────────────────
  # REST (PostgREST)
  # ─────────────────────────────────────────────
  rest:
    profiles: ["prod", "dev"]
    image: postgrest/postgrest:v9.0.0
    depends_on:
      - db
    restart: unless-stopped
    environment:
      PGRST_DB_URI: "postgres://${CLIENT_POSTGRESQL_USER}:${CLIENT_POSTGRESQL_PASSWORD}@db:5432/postgres"
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"

  # ─────────────────────────────────────────────
  # META (postgres-meta)
  # ─────────────────────────────────────────────
  meta:
    profiles: ["prod", "dev"]
    image: supabase/postgres-meta:v0.29.0
    depends_on:
      - db
    restart: unless-stopped
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PASSWORD: ${POSTGRESQL_PASSWORD}

  # ─────────────────────────────────────────────
  # STUDIO Supabase
  # ─────────────────────────────────────────────
  studio:
    profiles: ["prod", "dev"]
    image: supabase/studio:20230512-ad596d8
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      SUPABASE_URL: http://kong:8000
      SUPABASE_REST_URL: ${API_URL}/rest/v1/
      STUDIO_PG_META_URL: http://meta:8080
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}

  # ─────────────────────────────────────────────
  # PGADMIN → http://localhost:53603
  # ─────────────────────────────────────────────
  pgadmin:
    profiles: ["dev"]
    image: dpage/pgadmin4
    depends_on:
      - db
    ports:
      - "53603:53603"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${POSTGRESQL_PASSWORD}
      PGADMIN_LISTEN_PORT: 53603
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # DOZZLE (logs) → http://localhost:8444
  # ─────────────────────────────────────────────
  dozzle:
    profiles: ["dev"]
    container_name: dozzle-log-viewer-pfe11
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8444:8080"
    environment:
      DOZZLE_LEVEL: trace
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 3s
      timeout: 30s
      retries: 5
      start_period: 30s

volumes:
  postgres_data: